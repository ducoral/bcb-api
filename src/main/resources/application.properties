spring.application.name=bcb

spring.datasource.url=jdbc:postgresql://localhost:5432/bcb
spring.datasource.username=bcb
spring.datasource.password=bcb123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.mapper.accept-case-insensitive-enums=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

app.admin.token=admin-token
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=1h
app.conversation-worker.enabled=true
app.conversation-worker.interval=PT0.5S